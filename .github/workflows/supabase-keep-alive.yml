# Supabase pausa los proyectos del plan free tras 7 días sin actividad.
# Este workflow hace una consulta real a la base cada 3 días para mantenerlo activo.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *" # cada 3 días a las 12:00 UTC
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 30 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          # Falla el job (y GitHub avisa por correo) si el proyecto no responde
          test "$status" = "200"
